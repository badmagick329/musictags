[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "musictags"
version = "0.1.0"
description = "Tag FLAC files with Spotify metadata"
requires-python = ">=3.10"
dependencies = [
    "mutagen",
    "python-dotenv",
    "spotipy",
]

[project.scripts]
musictags = "musictags.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
